[project]
name = "clairnets"
version = "0.1.0"
description = "GLaDOS: a checked, differentiable reasoning organ woven into an LLM, trained on exactly-verifiable tasks."
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy", "z3-solver",  # z3: exact oracle for the clair.smt rung
                "transformers", "datasets", "peft"]  # OLMo host + data + LoRA for the woven LLM
