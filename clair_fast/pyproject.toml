[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "clair_fast"
version = "0.1.0"
description = "Rust+PyO3 hot path for clair.csp: exact_dedP / solutions / ac_step over finite CSPs."
requires-python = ">=3.10"

[tool.maturin]
features = ["pyo3/extension-module"]
